<script>
    window.openEditProductModal = function (productId) {
        if (typeof window.currentIsAdmin !== 'undefined' && !window.currentIsAdmin) {
            alert('This action is only allowed for administrator.');
            return;
        }
        var prod = null;
        if (window.productList && window.productList.length) {
            for (var i = 0; i < window.productList.length; i++) {
                if (window.productList[i].id == productId) {
                    prod = window.productList[i];
                    break;
                }
            }
        }

        if (!prod) {
            alert('Product details not found.');
            return;
        }

        var editId = document.getElementById('edit_product_id');
        var editType = document.getElementById('edit_product_type');
        var editName = document.getElementById('edit_product_name');
        var editCat = document.getElementById('edit_category');
        var editCost = document.getElementById('edit_cost');
        var editDesc = document.getElementById('edit_description');

        if (editId) editId.value = prod.id;
        if (editType) editType.value = prod.product_type;
        if (editName) editName.value = prod.product_name;
        if (editCat) editCat.value = prod.category;
        if (editCost) editCost.value = prod.cost;
        if (editDesc) editDesc.value = prod.description || '';

        if (typeof jQuery !== 'undefined' && jQuery('#edit-product-modal').length) {
            jQuery('#edit-product-modal').modal('show');
        } else if (typeof $ !== 'undefined' && $('#edit-product-modal').length) {
            $('#edit-product-modal').modal('show');
        }
    };

    window.openQuickEditPriceModal = function (elemOrId, productName, productCost, productCategory) {
        if (typeof window.currentIsAdmin !== 'undefined' && !window.currentIsAdmin) {
            alert('This action is only allowed for administrator.');
            return;
        }

        var productId = elemOrId;
        var name = productName;
        var cost = productCost;
        var category = productCategory;

        if (typeof elemOrId === 'object' && elemOrId !== null) {
            var $el = (typeof jQuery !== 'undefined') ? jQuery(elemOrId) : null;
            if ($el && $el.length) {
                productId = $el.attr('data-id') || $el.data('id');
                if (!name) name = $el.attr('data-name') || $el.data('name');
                if (!cost && cost !== 0) cost = $el.attr('data-cost') || $el.data('cost');
                if (!category) category = $el.attr('data-category') || $el.data('category');
            }
        }

        if (window.productList && window.productList.length) {
            for (var i = 0; i < window.productList.length; i++) {
                if (window.productList[i].id == productId) {
                    var p = window.productList[i];
                    if (!name) name = p.product_name;
                    if (!cost && cost !== 0) cost = p.cost;
                    if (!category) category = p.category_name || p.category;
                    break;
                }
            }
        }

        var fullDisplayName = '';
        if (category && name) {
            fullDisplayName = category + ' - ' + name;
        } else if (name) {
            fullDisplayName = name;
        } else if (category) {
            fullDisplayName = category;
        }

        var $jq = (typeof jQuery !== 'undefined') ? jQuery : (typeof $ !== 'undefined' ? $ : null);
        if ($jq) {
            $jq('#quick_price_product_id').val(productId);
            $jq('#quick_price_product_name').val(fullDisplayName);
            $jq('#quick_price_current_val').val('₹' + parseFloat(cost || 0).toFixed(2));
            $jq('#quick_price_new_val').val(parseFloat(cost || 0).toFixed(2));
            $jq('#quick-edit-price-modal').modal('show');
        }
    };
</script>

    <div class="modal fade" id="quick-edit-price-modal" tabindex="-1" role="dialog" aria-hidden="true">

            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" style="font-weight: 600;"><i
                            class="ri-price-tag-3-line mr-2 text-info"></i>Update Product Price</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">

                    </button>
                </div>
                <form id="quick-edit-price-form" action="" method="POST" onsubmit="return false;">

                            <label style="font-size: 13px; font-weight: 600; color: #475569;">Product Name</label>
                            <input type="text" id="quick_price_product_name" class="form-control bg-light" readonly>

                                placeholder="Enter new price">

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="btn-save-quick-price">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof jQuery !== 'undefined') {
                jQuery(document).ready(function ($) {
                    var table = $('.data-tables').DataTable();

                    // 1. Restore filter state from sessionStorage on page load / init
                    var savedType = sessionStorage.getItem('list_prod_filter_type');
                    var savedCat = sessionStorage.getItem('list_prod_filter_cat');

                    if (savedType) {
                        $('#filter-product-type').val(savedType);
                        table.column(1).search('^' + $.fn.dataTable.util.escapeRegex(savedType) + '$', true, false);
                    }
                    if (savedCat) {
                        $('#filter-category').val(savedCat);
                        table.column(2).search('^' + $.fn.dataTable.util.escapeRegex(savedCat) + '$', true, false);
                    }
                    if (savedType || savedCat) {
                        table.draw(false);
                    }

                    // 2. Filter change handlers with persistent state
                    $('#filter-product-type').on('change', function () {
                        var val = $(this).val();
                        if (val) {
                            sessionStorage.setItem('list_prod_filter_type', val);
                        } else {
                            sessionStorage.removeItem('list_prod_filter_type');
                        }
                        table.column(1).search(val ? '^' + $.fn.dataTable.util.escapeRegex(val) + '$' : '', true, false).draw();
                    });

                    $('#filter-category').on('change', function () {
                        var val = $(this).val();
                        if (val) {
                            sessionStorage.setItem('list_prod_filter_cat', val);
                        } else {
                            sessionStorage.removeItem('list_prod_filter_cat');
                        }
                        table.column(2).search(val ? '^' + $.fn.dataTable.util.escapeRegex(val) + '$' : '', true, false).draw();
                    });

                    // Delegated click handler for Edit Product Button
                    $(document).on('click', '.btn-edit-product', function (e) {
                        e.preventDefault();
                        var productId = $(this).data('id');
                        window.openEditProductModal(productId);
                    });

                    // Delegated click handler for Edit Price Button
                    $(document).on('click', '.btn-edit-price', function (e) {
                        e.preventDefault();
                        var productId = $(this).data('id');
                        var productName = $(this).data('name');
                        var productCost = $(this).data('cost');
                        var productCat = $(this).data('category');
                        window.openQuickEditPriceModal(productId, productName, productCost, productCat);
                    });

                    // Quick Edit Price Form Submit Handler
                    $(document).on('submit', '#quick-edit-price-form', function (e) {
                        e.preventDefault();
                        if (typeof window.currentIsAdmin !== 'undefined' && !window.currentIsAdmin) {
                            alert('This action is only allowed for administrator.');
                            return false;
                        }

                        var prodId = parseInt($('#quick_price_product_id').val());
                        var newPrice = parseFloat($('#quick_price_new_val').val());

                        if (isNaN(newPrice) || newPrice < 0) {
                            alert('Please enter a valid price.');
                            return false;
                        }

                        var $btn = $('#btn-save-quick-price');
                        var origText = $btn.html();
                        $btn.prop('disabled', true).html('<i class="ri-loader-4-line mr-1 fa-spin"></i>Saving...');

                        $.ajax({
                            url: window.posdashAjaxUrl,
                            type: 'POST',
                            data: {
                                action: 'update_product_cost',
                                nonce: window.posdashNonce,
                                product_id: prodId,
                                cost: newPrice
                            },
                            success: function (response) {
                                $btn.prop('disabled', false).html(origText);
                                if (response.success) {
                                    alert('Product price updated successfully!');
                                    $('#quick-edit-price-modal').modal('hide');

                                    // 1. Update in-memory productList
                                    if (window.productList && window.productList.length) {
                                        for (var i = 0; i < window.productList.length; i++) {
                                            if (window.productList[i].id == prodId) {
                                                window.productList[i].cost = newPrice;
                                                break;
                                            }
                                        }
                                    }

                                    // 2. Dynamically update DOM table row & DataTables cell without page reload
                                    var formattedPrice = '₹' + newPrice.toFixed(2);
                                    var $btnEdit = $('.btn-edit-price[data-id="' + prodId + '"]');
                                    if ($btnEdit.length) {
                                        $btnEdit.attr('data-cost', newPrice);
                                        $btnEdit.data('cost', newPrice);
                                        var $tr = $btnEdit.closest('tr');
                                        $tr.find('td').eq(4).html(formattedPrice);
                                        
                                        if (typeof jQuery !== 'undefined' && $.fn.DataTable && $('.data-tables').length) {
                                            try {
                                                var dtTable = $('.data-tables').DataTable();
                                                var cellNode = $tr.find('td').get(4);
                                                if (cellNode && dtTable && dtTable.cell) {
                                                    dtTable.cell(cellNode).data(formattedPrice).draw(false);
                                                }
                                            } catch (dtErr) {}
                                        }
                                    }
                                } else {
                                    alert('Error: ' + (response.data || 'Failed to update price.'));
                                }
                            },
                            error: function (xhr, status, error) {
                                $btn.prop('disabled', false).html(origText);
                                alert('Server error occurred while updating price: ' + error);
                            }
                        });
                    });
                });
            }
        });
    </script>

</div>
